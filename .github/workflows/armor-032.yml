name: Publish visual update 0.3.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - releases/ArcaneGenesis_Publish_0.3.2.zip
      - .github/workflows/armor-032.yml
permissions:
  contents: write
concurrency:
  group: armor-032
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify audited release archive
        run: |
          echo '18f42890b89eca65397a9a2febd8a3c1af5d33fe59774fa1b2fcc802e5c0ac09  releases/ArcaneGenesis_Publish_0.3.2.zip' | sha256sum --check
          unzip -q releases/ArcaneGenesis_Publish_0.3.2.zip -d .pack
      - name: Publish project assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='pack-0.3.2-armor.1'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target '${{ github.sha }}' --title 'Arcane Genesis 0.3.2 — объёмная броня Следопыта' --notes-file .pack/CHANGELOG.md --prerelease
          fi
          find .pack/objects -type f -print0 | xargs -0 -n 8 gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$tag" .pack/pack.json .pack/pack.json.sig .pack/CHANGELOG.md .pack/privacy-audit.json .pack/armor-preview.png .pack/ArcaneGenesis_Armor_Update_0.3.2.zip --repo "$GITHUB_REPOSITORY" --clobber

