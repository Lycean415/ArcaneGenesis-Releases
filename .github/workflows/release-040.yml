name: Build and publish Arcane Genesis 0.4.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-040.yml
      - releases/ArcaneGenesis-Launcher-Source-0.4.0.zip
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-040
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and unpack approved source
        run: |
          $ErrorActionPreference='Stop'
          $archive='releases/ArcaneGenesis-Launcher-Source-0.4.0.zip'
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2ce3c9700bcd1edfd6a5106981fb7af2c61500ee45973b61db0a51a58ebb17fd'){throw 'Source hash mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath .build/launcher
          & ./.build/launcher/bootstrap.ps1
          if($LASTEXITCODE -ne 0){throw 'Bootstrap failed'}
      - name: Test updater and signed distribution
        run: |
          $root=Join-Path $pwd '.build/launcher'
          $dotnet=Join-Path $root 'tools/dotnet10/dotnet.exe'
          $tool=Join-Path $root 'src/Arcane.Tools/bin/Release/net10.0-windows/Arcane.Tools.dll'
          & $dotnet $tool tests (Join-Path $env:RUNNER_TEMP 'launcher-tests')
          if($LASTEXITCODE -ne 0){throw 'Tests failed'}
          & $dotnet $tool verify-pack 'updates/0.4.0/pack.json' "$root/release-public.pem"
          if($LASTEXITCODE -ne 0){throw 'Pack signature invalid'}
      - name: Build autonomous installer
        run: |
          & ./.build/launcher/build.ps1 -Output (Join-Path $pwd 'artifacts') -SkipChannelSigning
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
      - name: Validate release object bytes
        run: |
          $manifest=Get-Content -LiteralPath updates/0.4.0/pack.json -Raw | ConvertFrom-Json
          foreach($file in $manifest.files){
            if($file.url.StartsWith('https://github.com/Lycean415/ArcaneGenesis-Releases/releases/download/pack-0.3.4/')){
              $path=Join-Path '.build/launcher/distribution/release/objects' $file.sha256
              if((Get-Item -LiteralPath $path).Length -ne $file.size -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw 'Release object mismatch'}
            }
          }
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          foreach($tag in @('pack-0.3.4','launcher-0.4.0')){
            gh release view $tag --repo $repo *> $null
            if($LASTEXITCODE -eq 0){throw "Release already exists; overwriting prohibited: $tag"}
          }
          gh release create pack-0.3.4 --repo $repo --target '${{ github.sha }}' --title 'Arcane Genesis 0.3.4' --notes-file notes/pack-0.3.4.md --draft
          if($LASTEXITCODE -ne 0){throw 'Create pack release failed'}
          $files=@(Get-ChildItem .build/launcher/distribution/release/objects -File | ForEach-Object FullName)
          $files+=@((Resolve-Path updates/0.4.0/pack.json).Path,(Resolve-Path updates/0.4.0/pack.json.sig).Path,(Resolve-Path notes/pack-0.3.4.md).Path)
          for($i=0;$i -lt $files.Count;$i+=8){
            $batch=$files[$i..([Math]::Min($i+7,$files.Count-1))]
            gh release upload pack-0.3.4 @batch --repo $repo
            if($LASTEXITCODE -ne 0){throw 'Pack upload failed'}
          }
          gh release edit pack-0.3.4 --repo $repo --draft=false --prerelease
          if($LASTEXITCODE -ne 0){throw 'Publish pack failed'}
          gh release create launcher-0.4.0 --repo $repo --target '${{ github.sha }}' --title 'Arcane Genesis Launcher 0.4.0' --notes-file notes/launcher-0.4.0.md --draft
          if($LASTEXITCODE -ne 0){throw 'Create launcher failed'}
          gh release upload launcher-0.4.0 artifacts/ArcaneGenesis-Setup-0.4.0.exe artifacts/ArcaneGenesis-Setup-0.4.0.exe.sha256 releases/ArcaneGenesis-Launcher-Source-0.4.0.zip artifacts/TESTING.md --repo $repo
          if($LASTEXITCODE -ne 0){throw 'Launcher upload failed'}
          gh release edit launcher-0.4.0 --repo $repo --draft=false
          if($LASTEXITCODE -ne 0){throw 'Publish launcher failed'}
