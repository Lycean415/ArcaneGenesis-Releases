name: Publish visual update 0.3.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - releases/ArcaneGenesis_Publish_0.3.1.zip
      - .github/workflows/visuals-031.yml
permissions:
  contents: write
concurrency:
  group: visuals-031
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify audited release archive
        run: |
          echo '252c4b360c5efafdb616b6caccdca4c609f8b10cdff332c20e9d34c5a8bf5591  releases/ArcaneGenesis_Publish_0.3.1.zip' | sha256sum --check
          unzip -q releases/ArcaneGenesis_Publish_0.3.1.zip -d .pack
      - name: Publish project assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='pack-0.3.1-visuals.1'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target '${{ github.sha }}' --title 'Arcane Genesis 0.3.1 — предметы и русский перевод' --notes-file .pack/CHANGELOG.md --prerelease
          fi
          find .pack/objects -type f -print0 | xargs -0 -n 8 gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$tag" .pack/pack.json .pack/pack.json.sig .pack/CHANGELOG.md .pack/privacy-audit.json .pack/items-preview.png .pack/ArcaneGenesis_Visual_Update_0.3.1.zip --repo "$GITHUB_REPOSITORY" --clobber
